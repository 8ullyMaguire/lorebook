[workspace]
resolver = "2"
members = [
    "crates/lorebook-core",
    "crates/lorebook-calibre",
    "crates/lorebook-interop-check",
    "crates/lorebook-scan",
    "crates/lorebook-parse",
    # Tauri app shell. Kept in the workspace so it is built and type-checked by
    # the same `cargo test` run as the crates it depends on.
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/hirrolot19/lorebook"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions", "backup"] }
blake3 = "1"
